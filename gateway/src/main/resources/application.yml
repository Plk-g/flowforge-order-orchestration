server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "*"
      routes:
        - id: orders-rest
          uri: ${ORDER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/orders/**
        - id: orders-graphql
          uri: ${ORDER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/graphql,/graphiql/**
        - id: orders-docs
          uri: ${ORDER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
